<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Veterinario</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Fondo de colores */
        body {
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
        }
        
        /* Diseño de la tarjeta */
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: none;
        }
        .card-header {
            border-radius: 15px 15px 0 0 !important;
            background: linear-gradient(135deg, #007bff, #0056b3);
        }

        /* Magia CSS: Embellecemos tu form.as_p automáticamente */
        .formulario-django p {
            margin-bottom: 1.2rem;
        }
        .formulario-django label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.4rem;
            display: block;
        }
        .formulario-django input, 
        .formulario-django select, 
        .formulario-django textarea {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid #ced4da;
            border-radius: 8px;
            background-color: #fdfdfd;
            transition: border-color 0.2s;
        }
        .formulario-django input:focus {
            border-color: #86b7fe;
            outline: none;
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
        }
    </style>
</head>
<!-- Usamos clases nativas de Bootstrap (min-vh-100 d-flex) para centrar de forma segura -->
<body class="d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card bg-white">
                    <div class="card-header text-white text-center py-4">
                        <h4 class="mb-0 fw-bold">Registrar Veterinario</h4>
                    </div>
                    
                    <div class="card-body p-4 p-md-5">
                        <form method="post" class="formulario-django">
                            {% csrf_token %}
                            
                            <!-- Volvemos al método seguro que ya te funcionaba -->
                            {{ form.as_p }}
                            
                            <div class="d-grid gap-3 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Guardar Registro</button>
                                <a href="javascript:history.back()" class="btn btn-light border fw-semibold text-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

</body>
</html>
