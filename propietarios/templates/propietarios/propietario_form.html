{% extends 'base.html' %}

{% block title %}Registrar Propietario{% endblock %}

{% block extra_css %}
<style>
    .card {
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        border: none;
    }
    .card-header {
        border-radius: 15px 15px 0 0 !important;
        background: linear-gradient(135deg, #007bff, #0056b3);
    }
    .formulario-django p {
        margin-bottom: 1.2rem;
    }
    .formulario-django label {
        font-weight: 600;
        color: #495057;
        margin-bottom: 0.4rem;
        display: block;
    }
    .formulario-django input, 
    .formulario-django select, 
    .formulario-django textarea {
        width: 100%;
        padding: 0.6rem 1rem;
        border: 1px solid #ced4da;
        border-radius: 8px;
        background-color: #fdfdfd;
        transition: border-color 0.2s;
    }
    .formulario-django input:focus,
    .formulario-django select:focus,
    .formulario-django textarea:focus {
        border-color: #86b7fe;
        outline: none;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, .25);
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card bg-white">
            <div class="card-header text-white text-center py-4">
                <h4 class="mb-0 fw-bold">Registrar Propietario</h4>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form method="post" class="formulario-django">
                    {% csrf_token %}
                    {{ form.as_p }}
                    
                    <div class="d-grid gap-3 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">Guardar Registro</button>
                        <a href="{% url 'home' %}" class="btn btn-light border fw-semibold text-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
