
{% extends 'base.html' %}

{% block title %}
    {% if object %}Editar cita{% else %}Registrar cita{% endif %}
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

        <div class="card border-0 shadow">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0">
                    {% if object %}Editar cita{% else %}Registrar nueva cita{% endif %}
                </h4>
            </div>

            <div class="card-body p-4">

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            Guardar
                        </button>

                        <a href="{% url 'citas:listar' %}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
